[project]
name = "luraph-recovery-kit"
version = "0.1.0"
description = "Evidence-driven Luraph Lua recovery tools"
requires-python = ">=3.11"
dependencies = [
    "lupa",
    "luaparser",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
